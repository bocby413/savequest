<!doctype html>
<meta charset="utf-8">
<title>轉身對照表</title>
<style>
  body{margin:0;background:#14121f;color:#e8e6f0;font:14px system-ui,"Noto Sans TC",sans-serif}
  h1{font-size:17px;padding:12px 16px 0;margin:0}
  .bar{padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,button{background:#241f38;color:#e8e6f0;border:1.5px solid #3a3358;border-radius:9px;
    padding:6px 11px;font:inherit;cursor:pointer}
  table{border-collapse:collapse;margin:0 8px 40px}
  th{font-size:12px;color:#9a94b8;font-weight:600;padding:4px}
  td{padding:0}
  .cell{width:var(--cs,132px);height:var(--cs,132px);background:radial-gradient(ellipse at 50% 92%,#241f38 0%,transparent 70%);
    border:1px solid #2c2643;border-radius:10px;margin:2px}
  .cell svg{width:100%;height:100%;display:block}
  .name{font-size:12.5px;color:#c9c4e0;text-align:right;padding-right:8px;white-space:nowrap}
  iframe{position:absolute;left:-9999px;width:400px;height:400px;border:0}
</style>
<h1>轉身對照表　<span style="color:#9a94b8;font-size:13px">每一列一隻角色，每一欄一個角度</span></h1>
<div class="bar">
  <label>配件 <select id="wear"><option value="">不穿</option></select></label>
  <button onclick="location.reload()">重新載入</button>
  <span id="msg" style="color:#9a94b8"></span>
</div>
<div id="out" style="overflow:auto"></div>
<iframe id="app" src="./index.html"></iframe>
<script>
/* 用 iframe 載入本體，在它自己的作用域裡把圖畫出來再拿回來。
   本體的 TCHARS／ITEMS 是 const，不會掛到 window 上，所以要用 eval 進去拿 */
const ANGLES=[0,45,135,180,225,315];
let W=null;
/* ?only=a-fox,a-rab 只看這幾隻；?s=300 把格子放大，細節才看得清楚 */
const Q=new URLSearchParams(location.search);
const ONLY=(Q.get('only')||'').split(',').filter(Boolean);
document.documentElement.style.setProperty('--cs',(Q.get('s')||132)+'px');
app.onload=()=>setTimeout(init,500);
function init(){
  W=app.contentWindow;
  try{ W.eval('1'); }catch(e){ msg.textContent='進不去 iframe：'+e.message; return; }
  let list;
  try{
    list=JSON.parse(W.eval(
      'JSON.stringify(TCHARS.map(a=>({k:a.k,n:a.n,items:ITEMS.filter(i=>i.only===a.k)'+
      '.map(i=>({id:i.id,n:i.n,slot:i.slot}))})))'));
  }catch(e){ msg.textContent='拿不到資料：'+e.message; return; }
  const opts=['<option value="">不穿</option>'];
  list.forEach(a=>a.items.forEach(it=>
    opts.push('<option value="'+it.id+'">'+a.n+'／'+it.n+'（'+it.slot+'）</option>')));
  wear.innerHTML=opts.join('');
  msg.textContent='';
  draw();
}
function draw(){
  if(!W) return;
  const id=wear.value.replace(/'/g,'');
  let html;
  try{
    html=W.eval('(function(){'+
      'wearRaw=1; db.settings.wear=db.settings.wear||{};'+
      'var A=['+ANGLES.join(',')+'], id="'+id+'";'+
      'var h="<table><tr><th></th>"+A.map(function(d){return "<th>"+d+"°</th>";}).join("")+"</tr>";'+
      'var ONLY='+JSON.stringify(ONLY)+';'+
      'TCHARS.filter(function(a){return !ONLY.length||ONLY.indexOf(a.k)>=0;}).forEach(function(a){'+
        'var it=id?ITEMS.find(function(x){return x.id===id;}):null;'+
        'db.settings.wear[a.k]=(it&&it.only===a.k)?[it.id]:[];'+
        'h+="<tr><td class=\\"name\\">"+a.n+"</td>";'+
        'A.forEach(function(d){'+
          'h+="<td><div class=\\"cell\\">"+chSVG(a,"idle",0,d*Math.PI/180)+"</div></td>";});'+
        'h+="</tr>";});'+
      'return h+"</table>";})()');
  }catch(e){ msg.textContent='畫圖失敗：'+e.message; return; }
  out.innerHTML=html;
}
wear.onchange=draw;
</script>
