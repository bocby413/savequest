name: 收盤價

on:
  schedule:
    # GitHub 的排程不保證準時，常常整個時段漏掉，所以多擺幾次；
    # 內容沒變就不會 commit，多跑幾次不會多出垃圾紀錄
    - cron: '35 6 * * 1-5'    # UTC 06:35 = 台北 14:35，剛收盤
    - cron: '10 7 * * 1-5'    # 台北 15:10
    - cron: '15 9 * * 1-5'    # 台北 17:15
    - cron: '0 11 * * 1-5'    # 台北 19:00
    - cron: '0 14 * * 1-5'    # 台北 22:00，上市那支 openapi 常常要這麼晚才換
    - cron: '30 16 * * 1-5'   # 台北 00:30，補最後一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓收盤價
        run: python scripts/fetch_prices.py
      - name: 有變動才提交
        run: |
          git config user.name "prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "價格沒有變動"
            exit 0
          fi
          git commit -m "收盤價 $(TZ=Asia/Taipei date +%F)"
          # 本機工作排程、Apps Script、GitHub 自己的 cron 三邊都會戳，
          # 兩個 run 撞在一起的話後推的那個會被擋掉（non-fast-forward）。
          # 那不是壞掉，重新站到最新的 main 上面、把我們這份檔案放回去再推。
          # prices.json 整份都是這支腳本產生的，直接用我們的覆蓋就對了。
          cp prices.json "$RUNNER_TEMP/prices.json"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "第 $i 次推不上去（多半是跟別的 run 撞到），重試"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/prices.json" prices.json
            git add prices.json
            if git diff --staged --quiet; then
              echo "別的 run 已經寫進一樣的內容了"
              exit 0
            fi
            git commit -m "收盤價 $(TZ=Asia/Taipei date +%F)"
            sleep $((i * 5))
          done
          echo "推了三次都失敗"
          exit 1
