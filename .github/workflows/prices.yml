name: 收盤價

on:
  schedule:
    - cron: '35 6 * * 1-5'    # UTC 06:35 = 台北 14:35，週一到週五盤後
    - cron: '15 9 * * 1-5'    # 台北 17:15 再補一次，防上櫃資料更新較慢
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓收盤價
        run: python scripts/fetch_prices.py
      - name: 有變動才提交
        run: |
          git config user.name "prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "價格沒有變動"
          else
            git commit -m "收盤價 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
