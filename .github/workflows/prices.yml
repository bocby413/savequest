name: 收盤價

on:
  schedule:
    # GitHub 的排程不保證準時，常常整個時段漏掉，所以多擺幾次；
    # 內容沒變就不會 commit，多跑幾次不會多出垃圾紀錄
    - cron: '35 6 * * 1-5'    # UTC 06:35 = 台北 14:35，剛收盤
    - cron: '10 7 * * 1-5'    # 台北 15:10
    - cron: '15 9 * * 1-5'    # 台北 17:15
    - cron: '0 11 * * 1-5'    # 台北 19:00
    - cron: '0 14 * * 1-5'    # 台北 22:00，上市那支 openapi 常常要這麼晚才換
    - cron: '30 16 * * 1-5'   # 台北 00:30，補最後一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓收盤價
        run: python scripts/fetch_prices.py
      - name: 有變動才提交
        run: |
          git config user.name "prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "價格沒有變動"
          else
            git commit -m "收盤價 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
