name: 看現在生效的規則

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save google-auth-library@9
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/rules-dump.mjs
