name: 打工完成通知

# GitHub 的排程會延遲，負載高的時候甚至整次被丟掉，間隔越短越容易被丟。
# 所以反過來用密一點的間隔換命中率：5 分鐘一次，被丟掉一次還有下一次。
# 避開整點與半點，那兩個時間全世界的 cron 都擠在一起。
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: work-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 裝套件
        run: npm i --no-save firebase-admin@12 web-push@3
      - name: 發通知
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/notify.mjs
