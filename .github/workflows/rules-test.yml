name: 測規則哪一行擋的

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save google-auth-library@9 firebase-admin@12
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/rules-test.mjs
